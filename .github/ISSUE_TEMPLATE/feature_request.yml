name: Feature request
description: Propose a focused improvement to the Openings product
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Openings. For early ideas or open-ended questions, start with GitHub Discussions.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters this problem, and what are they trying to accomplish?
      placeholder: Candidates who... need to... because...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change and the expected outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional approaches or workarounds you have already considered.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in helping implement this change.
