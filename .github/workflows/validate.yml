name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the website
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js 20
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate deterministic contracts
        run: npm run test

      - name: Lint source
        run: npm run lint

      - name: Build the static production site
        run: npm run build

      - name: Validate the generated export
        run: npm run test:metadata
